
workflows:
  android-workflow:
    name: Rudra Test Universal APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --org com.rudradigitalart --project-name rudratest .

      - name: Clean previous build
        script: |
          flutter clean

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Check Flutter environment
        script: |
          flutter doctor -v

      - name: Build Universal Release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/*.apk
