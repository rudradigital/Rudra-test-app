
workflows:
  android-workflow:
    name: Rudra Test ARM APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: |
          flutter create --platforms=android --org com.rudradigitalart --project-name rudratest .
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build ARM APK
        script: |
          flutter build apk --release --target-platform android-arm64
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
