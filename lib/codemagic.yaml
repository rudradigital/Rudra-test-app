
workflows:
  android-workflow:
    name: Rudra Test Android Build
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project
        script: |
          flutter create \
            --platforms=android \
            --org com.rudradigitalart \
            --project-name rudratest .

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
